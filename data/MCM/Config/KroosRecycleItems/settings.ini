; KroosRecycleItems - default settings (MCM Helper layout). Percentages are written 0-100.
; The MCM writes the player's changes to Data/MCM/Settings/KroosRecycleItems.ini, which wins.

[General]
; 1 = give back a share of every material (fRate, Progression); 0 = use iFullMode instead
bPartial = 1
; When bPartial = 0: 0 = whole recipe, 1 = whole main material only, 2 = one of each material
iFullMode = 0
fRate = 10
; Smithing experience, as a share of what crafting the item gives
fExperience = 10
; Read when the game starts (changes apply at the next launch):
; clothing without a recipe of its own: 0 = linen for robes and hoods, leather strips for gloves and boots;
; 1 = leather strips for everything
iClothMaterial = 0
; simple plates and glazed pottery: 0 = clay, 1 = iron ingot
iPlateMaterial = 0
; staves recycled at the staff enchanter (Dragonborn)
bStaves = 1

[Enchanted]
; Levels needed to recycle an enchanted item (a plain copy is always used first)
fSmithing = 50
fEnchanting = 50
; Staves: 1 = they need fEnchanting (not fSmithing) and their chances follow Enchanting up to fSkillMax
bStaffLevels = 1

[Categories]
; RECYCLING categories shown at the smelter, tanning rack and staff enchanter
bWeapons = 1
bArmor = 1
bJewelry = 1
bClothing = 1
bMisc = 1
; Items without a recipe of their own borrow one from a similar item (same material and kind)
bBorrowed = 1

[Orders]
; Recycling orders at a blacksmith (talk to any blacksmith)
bEnabled = 1
; Price: share of the item's value, at least fMinPrice gold per item (per lot for miscellaneous items)
fPrice = 10
fMinPrice = 5
; In-game hours before the order is ready
fHours = 24
; The blacksmith recycles like a player with this Smithing level
fSkill = 50
; Price per hold, in percent of the base price
fHoldHaafingar = 150
fHoldReach = 130
fHoldEastmarch = 120
fHoldSolstheim = 120
fHoldRift = 110
fHoldStronghold = 100
fHoldWhiterun = 90
fHoldSmall = 80
; Discounts and surcharge, in percent
fOrc = 40
fNonNord = 30
fThieves = 25
fThane = 20
fCompanions = 20
fCivilWar = 10
; Married to the blacksmith: free
bSpouseFree = 1
; Reminders about orders in progress, every fReminderHours game hours (top-left notifications)
bReminders = 1
fReminderHours = 2

[Progression]
; Smithing levels: start of the ramps, guaranteed main material, end of the secondary ramp
fSkillStart = 15
fSkillGuarantee = 50
fSkillMax = 100
; Chance of one secondary material at fSkillStart, fSkillGuarantee and fSkillMax
fSecondaryStart = 1
fSecondaryMid = 10
fSecondaryMax = 20
